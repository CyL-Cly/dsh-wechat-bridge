# 追加到 home 上 wechat 栈（示意）。与 client_<ROBOT_CODE> 同网。
# 本机 openresty: proxy_pass http://127.0.0.1:8787;
# 并 proxy_set_header X-Bridge-Secret <BRIDGE_WEBHOOK_SECRET>;

services:
  dsh-wechat-bridge:
    image: node:24-bookworm
    container_name: dsh-wechat-bridge
    working_dir: /app
    volumes:
      - /opt/dsh-wechat-bridge:/app
      - dsh_home:/app/.dsh-home
    env_file:
      - /opt/dsh-wechat-bridge/.env
    environment:
      BRIDGE_HOST: 0.0.0.0
      BRIDGE_PORT: "8787"
      WECHAT_CLIENT_BASE_URL: http://client_xTVn5dQNV3zQqjCD:9000
      AGENT_MODE: sdk
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
    command: ["node", "dist/index.js"]
    ports:
      - "127.0.0.1:8787:8787"
    networks:
      - wechat-robot
    restart: unless-stopped

volumes:
  dsh_home:

networks:
  wechat-robot:
    external: true

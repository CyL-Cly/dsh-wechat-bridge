# OpenResty / nginx: reverse-proxy to dsh-wechat-bridge on loopback.
# Webhook auth is OPTIONAL — only set the secret headers if BRIDGE_WEBHOOK_SECRET is set.

upstream dsh_wechat_bridge {
    server 127.0.0.1:8787;
    keepalive 8;
}

# Example: wechat-robot webhook → bridge
location /dsh-bridge/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Uncomment only when BRIDGE_WEBHOOK_SECRET is configured:
    # proxy_set_header X-Bridge-Secret <PUT_BRIDGE_WEBHOOK_SECRET_HERE>;
    # proxy_set_header Authorization "Bearer <PUT_BRIDGE_WEBHOOK_SECRET_HERE>";
    proxy_pass http://dsh_wechat_bridge/;
}

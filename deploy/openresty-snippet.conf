# Example openresty / nginx location for dsh-wechat-bridge on same host.
# Upstream listens on 127.0.0.1:8787 (host) or Docker publish 127.0.0.1:8787:8787.
#
# Set $bridge_token to the same value as BRIDGE_WEBHOOK_SECRET / ACCESS_TOKEN.
# wechat-robot-client system_settings.webhook_url should point at this public URL,
# with webhook_headers including X-Bridge-Secret (or Authorization: Bearer …).

# map $http_upgrade $connection_upgrade { default upgrade; '' close; }  # if needed elsewhere

location /dsh-webhook/ {
    proxy_pass http://127.0.0.1:8787/webhook;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Required by bridge (reject missing/wrong token with 401)
    proxy_set_header X-Bridge-Secret <PUT_BRIDGE_WEBHOOK_SECRET_HERE>;
    # alternatively:
    # proxy_set_header Authorization "Bearer <PUT_BRIDGE_WEBHOOK_SECRET_HERE>";
    proxy_read_timeout 60s;
    client_max_body_size 8m;
}

location /dsh-health {
    proxy_pass http://127.0.0.1:8787/health;
    proxy_set_header Host $host;
}

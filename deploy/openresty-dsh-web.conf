# OpenResty / nginx: reverse-proxy to DeepSeek Harness Web UI (dsh web).
# Requires DSH_WEB_NO_TOKEN=1 (or DSH_BROWSER_AUTH=disabled) on the dsh process
# so browsers need no ?token= launch URL / signed cookie.
#
# Typical local bind (do NOT expose 3080 on public interfaces without your own auth):
#   DSH_WEB_NO_TOKEN=1 dsh web --host 127.0.0.1 --port 3080

upstream dsh_web_ui {
    server 127.0.0.1:3080;
    keepalive 16;
}

# WebSocket + long-lived RPC used by the SPA
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

location /dsh/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    # Strip /dsh prefix so authorizeIndex sees pathname /
    rewrite ^/dsh/?(.*)$ /$1 break;
    proxy_pass http://dsh_web_ui;
}

